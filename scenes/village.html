<!DOCTYPE html>
<html lang="en">
<head>

<title>Amberhollow — A Medieval Village at Golden Hour</title>
<style>
    html, body { margin:0; height:100%; overflow:hidden; background:#181009; }
    #app { position:fixed; inset:0; }
    canvas { display:block; }
    #vignette {
        position:fixed; inset:0; pointer-events:none; z-index:4;
        background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(24,10,4,.42) 82%, rgba(12,5,2,.72) 100%);
    }
    #title {
        position:fixed; top:20px; left:26px; z-index:5; pointer-events:none;
        color:#ffe6bd; font-family:Georgia,'Times New Roman',serif;
        text-shadow:0 2px 14px rgba(0,0,0,.75);
    }
    #title h1 { margin:0; font-size:27px; font-weight:normal; letter-spacing:6px; }
    #title p  { margin:3px 0 0 2px; font-size:10px; letter-spacing:3.2px; text-transform:uppercase; opacity:.72; }
    #hint {
        position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:5; pointer-events:none;
        color:#ffd9a0; font-family:Georgia,serif; font-size:12.5px; letter-spacing:2px;
        background:rgba(30,18,8,.45); border:1px solid rgba(255,214,150,.28);
        padding:9px 22px; border-radius:30px; backdrop-filter:blur(4px);
        text-shadow:0 1px 6px #000; transition:opacity 1.4s; opacity:1; white-space:nowrap;
    }
    #hint.gone { opacity:0; }
    #loader {
        position:fixed; inset:0; z-index:10; background:#151009;
        display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center;
        color:#d8b878; font-family:Georgia,serif; letter-spacing:4px; font-size:14px;
        transition:opacity .9s;
    }
    #loader.done { opacity:0; pointer-events:none; }
    #loader .bar { width:180px; height:2px; background:rgba(216,184,120,.2); overflow:hidden; border-radius:2px; }
    #loader .bar::after { content:''; display:block; width:60px; height:100%; background:#d8b878; animation:ld 1.1s infinite ease-in-out; }
    @keyframes ld { 0%{transform:translateX(-70px)} 100%{transform:translateX(200px)} }
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title"><h1>AMBERHOLLOW</h1><p>A Medieval Village at Golden Hour</p></div>
<div id="hint">Drag to look around &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Auto-tour resumes idle</div>
<div id="loader"><div>AMBERHOLLOW</div><div class="bar"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   AMBERHOLLOW — a golden-hour medieval village
   Every texture is painted on canvas, every model built in code.
   ============================================================ */

// ---------- deterministic RNG ----------
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5; t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(20240613);
const rr  = (a,b) => a + rand()*(b-a);
const pick = arr => arr[Math.floor(rand()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ============================================================
// 1. PROCEDURAL TEXTURES (canvas)
// ============================================================
function makeTex(w, h, draw, {srgb=true, repeat=null} = {}){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    if (repeat) t.repeat.set(repeat[0], repeat[1]);
    return t;
}
// value-noise speckle helper
function speckle(g,w,h,n,alpha,light,dark){
    for(let i=0;i<n;i++){
        g.fillStyle = rand()<0.5 ? light : dark;
        g.globalAlpha = rand()*alpha;
        const s = rr(1,4);
        g.fillRect(rand()*w, rand()*h, s, s);
    }
    g.globalAlpha = 1;
}

// ---- plaster (near-white; tinted per-house via material.color) ----
const plasterTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle = '#efe8da'; g.fillRect(0,0,w,h);
    for(let i=0;i<46;i++){ // soft blotches
        const x=rand()*w, y=rand()*h, r=rr(14,60);
        const grd=g.createRadialGradient(x,y,0,x,y,r);
        const tone = rand()<0.5 ? '210,200,180' : '255,252,244';
        grd.addColorStop(0,`rgba(${tone},${rr(0.12,0.3)})`); grd.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
    // hairline cracks
    g.strokeStyle='rgba(90,80,65,0.35)'; g.lineWidth=1;
    for(let i=0;i<7;i++){ g.beginPath(); let x=rand()*w,y=rand()*h; g.moveTo(x,y);
        for(let s=0;s<6;s++){ x+=rr(-26,26); y+=rr(8,30); g.lineTo(x,y);} g.stroke(); }
    speckle(g,w,h,900,0.25,'#fff','#8a8070');
},{repeat:[1.6,1.6]});

// ---- wood planks ----
const woodTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#8a6844'; g.fillRect(0,0,w,h);
    const rows=6, ph=h/rows;
    for(let r=0;r<rows;r++){
        const shade = rr(-22,22);
        g.fillStyle=`rgb(${138+shade},${104+shade},${68+shade})`;
        g.fillRect(0,r*ph,w,ph);
        g.fillStyle='rgba(40,24,12,0.85)'; g.fillRect(0,r*ph,w,2.5);
        // grain
        for(let i=0;i<16;i++){
            g.strokeStyle=`rgba(60,38,18,${rr(0.25,0.55)})`; g.lineWidth=rr(0.6,1.6);
            g.beginPath(); const y=r*ph+rr(4,ph-4); g.moveTo(0,y);
            for(let x=0;x<=w;x+=32) g.lineTo(x, y + Math.sin(x*0.05 + r*9 + i)*rr(1,3.5));
            g.stroke();
        }
        if(rand()<0.8){ // knot
            const kx=rand()*w, ky=r*ph+ph/2;
            g.strokeStyle='rgba(50,30,14,0.8)'; g.lineWidth=1.6;
            g.beginPath(); g.ellipse(kx,ky,rr(3,6),rr(2,3.4),0,0,7); g.stroke();
        }
    }
});

// ---- roof tiles (terracotta-ish, tinted by material.color) ----
const roofTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#b9b0a4'; g.fillRect(0,0,w,h);
    const tw=30, th=30;
    for(let y=-1;y<h/th+1;y++){
        const off=(y%2)? tw/2 : 0;
        for(let x=-1;x<w/tw+1;x++){
            const px=x*tw+off, py=y*th, shade=rr(-26,26);
            const grd=g.createLinearGradient(px,py,px,py+th);
            grd.addColorStop(0,`rgb(${205+shade},${200+shade},${190+shade})`);
            grd.addColorStop(0.75,`rgb(${170+shade},${165+shade},${155+shade})`);
            grd.addColorStop(1,`rgb(${105+shade},${100+shade},${94+shade})`);
            g.fillStyle=grd;
            g.beginPath(); g.roundRect(px+1.5,py+1.5,tw-3,th-3,7); g.fill();
            g.fillStyle='rgba(255,255,255,0.16)';
            g.beginPath(); g.roundRect(px+3,py+3,tw-6,7,4); g.fill();
        }
    }
    speckle(g,w,h,500,0.2,'#fff','#333');
},{repeat:[0.55,0.55]});

// ---- thatch ----
const thatchTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#a8873f'; g.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){
        g.strokeStyle=pick(['#c9ac58','#8a6c30','#e0c878','#6e5526','#b99a4c']);
        g.globalAlpha=rr(0.4,0.9); g.lineWidth=rr(1,2.6);
        const x=rand()*w, y=rand()*h, len=rr(14,44);
        g.beginPath(); g.moveTo(x,y); g.lineTo(x+rr(-4,4), y+len); g.stroke();
    }
    g.globalAlpha=1;
    for(let y=40;y<h;y+=64){ g.fillStyle='rgba(70,52,20,0.55)'; g.fillRect(0,y,w,5); }
},{repeat:[0.6,0.6]});

// ---- stone blocks ----
const stoneTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#6e685c'; g.fillRect(0,0,w,h); // mortar
    const rows=6, rh=h/rows;
    for(let r=0;r<rows;r++){
        let x = (r%2)? -30 : 0;
        while(x<w+40){
            const sw=rr(38,74), shade=rr(-24,24);
            g.fillStyle=`rgb(${148+shade},${143+shade},${132+shade})`;
            g.beginPath(); g.roundRect(x+2.5, r*rh+2.5, sw-5, rh-5, 9); g.fill();
            g.fillStyle='rgba(255,255,255,0.14)';
            g.beginPath(); g.roundRect(x+5, r*rh+5, sw-10, 6, 4); g.fill();
            g.fillStyle='rgba(0,0,0,0.22)';
            g.beginPath(); g.roundRect(x+5, r*rh+rh-11, sw-10, 6, 4); g.fill();
            x += sw;
        }
    }
    speckle(g,w,h,600,0.28,'#e8e4d8','#3a362e');
},{repeat:[1.4,1.4]});

// ---- cobblestone (plaza) ----
const cobbleTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#5c574e'; g.fillRect(0,0,w,h);
    const s=36;
    for(let y=0;y<h/s+1;y++) for(let x=0;x<w/s+1;x++){
        const px=x*s+((y%2)?s/2:0)+rr(-2,2), py=y*s+rr(-2,2), shade=rr(-16,26);
        const grd=g.createRadialGradient(px+s/2-6,py+s/2-6,2, px+s/2,py+s/2,s*0.62);
        grd.addColorStop(0,`rgb(${178+shade},${172+shade},${158+shade})`);
        grd.addColorStop(1,`rgb(${108+shade},${103+shade},${93+shade})`);
        g.fillStyle=grd;
        g.beginPath(); g.ellipse(px+s/2,py+s/2,s*0.46,s*0.4,rr(-0.2,0.2),0,7); g.fill();
    }
    speckle(g,w,h,700,0.25,'#ddd','#2c2a26');
},{repeat:[7,7]});

// ---- grass ground ----
const grassTex = makeTex(512,512,(g,w,h)=>{
    g.fillStyle='#57683a'; g.fillRect(0,0,w,h);
    for(let i=0;i<60;i++){ // large tonal patches
        const x=rand()*w,y=rand()*h,r=rr(30,110);
        const grd=g.createRadialGradient(x,y,0,x,y,r);
        const tone = rand()<0.5 ? '96,110,58' : '72,84,44';
        grd.addColorStop(0,`rgba(${tone},${rr(0.3,0.6)})`); grd.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
    for(let i=0;i<2600;i++){ // blade strokes
        g.strokeStyle=pick(['#6b7c42','#48582e','#7d8a4a','#93a05a','#5c6c38','#a8a060']);
        g.globalAlpha=rr(0.4,0.85); g.lineWidth=rr(0.8,1.8);
        const x=rand()*w,y=rand()*h;
        g.beginPath(); g.moveTo(x,y); g.lineTo(x+rr(-3,3), y-rr(3,9)); g.stroke();
    }
    g.globalAlpha=1; speckle(g,w,h,900,0.25,'#c9c98a','#2c3a20');
},{repeat:[46,46]});

// ---- dirt path ----
const dirtTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#7d6244'; g.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){
        const x=rand()*w,y=rand()*h,r=rr(16,70);
        const grd=g.createRadialGradient(x,y,0,x,y,r);
        grd.addColorStop(0,rand()<0.5?`rgba(96,74,50,0.5)`:`rgba(150,124,88,0.4)`);
        grd.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
    speckle(g,w,h,1200,0.35,'#b39a72','#3e2f1e');
    for(let i=0;i<26;i++){ g.fillStyle='#8f8578'; g.globalAlpha=rr(0.5,0.9);
        g.beginPath(); g.ellipse(rand()*w,rand()*h,rr(2,4.5),rr(1.5,3.5),rand()*3,0,7); g.fill(); }
    g.globalAlpha=1;
},{repeat:[2,7]});

// ---- straw / hay ----
const strawTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#b3903f'; g.fillRect(0,0,w,h);
    for(let i=0;i<1000;i++){
        g.strokeStyle=pick(['#d6b968','#8f7136','#e8d88a','#a8863e','#c9a94e']);
        g.globalAlpha=rr(0.5,0.95); g.lineWidth=rr(0.8,2);
        const y=rand()*h; g.beginPath(); g.moveTo(rand()*w,y); g.lineTo(rand()*w, y+rr(-6,6)); g.stroke();
    }
    g.globalAlpha=1;
});

// ---- foliage blotches (for tree canopies) ----
const foliageTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#9aa06a'; g.fillRect(0,0,w,h);
    for(let i=0;i<320;i++){
        g.fillStyle=pick(['#b8bd7e','#7d8448','#cdd08e','#5f6836','#c9b264']);
        g.globalAlpha=rr(0.35,0.8);
        g.beginPath(); g.arc(rand()*w,rand()*h,rr(3,14),0,7); g.fill();
    }
    g.globalAlpha=1;
});

// ---- soft round glow (light sprites, fireflies, smoke base) ----
const glowTex = makeTex(128,128,(g,w,h)=>{
    const grd=g.createRadialGradient(w/2,h/2,2,w/2,h/2,w/2);
    grd.addColorStop(0,'rgba(255,255,255,1)');
    grd.addColorStop(0.28,'rgba(255,255,255,0.7)');
    grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.fillRect(0,0,w,h);
},{srgb:false});

// ---- puffy cloud ----
const cloudTex = makeTex(256,128,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    for(let i=0;i<16;i++){
        const x=rr(w*0.18,w*0.82), y=rr(h*0.36,h*0.66), r=rr(15,38);
        const grd=g.createRadialGradient(x,y,1,x,y,r);
        grd.addColorStop(0,'rgba(255,255,255,0.85)');
        grd.addColorStop(0.65,'rgba(255,255,255,0.32)');
        grd.addColorStop(1,'rgba(255,255,255,0)');
        g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
},{srgb:false});

// ---- grass tuft (alpha) ----
const tuftTex = makeTex(128,128,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    for(let i=0;i<11;i++){
        const bx=w/2+rr(-26,26), lean=rr(-24,24), top=rr(6,52);
        const grd=g.createLinearGradient(bx,h,bx,top);
        grd.addColorStop(0,'#3e4e26'); grd.addColorStop(1, pick(['#8a9a52','#a8a860','#6b7c42']));
        g.strokeStyle=grd; g.lineWidth=rr(4,7.5); g.lineCap='round';
        g.beginPath(); g.moveTo(bx,h); g.quadraticCurveTo(bx+lean*0.4,h*0.55, bx+lean,top); g.stroke();
    }
},{srgb:true});

// ---- lit window (warm arch) ----
const litWindowTex = makeTex(96,128,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    const arch = () => { g.beginPath(); g.moveTo(8,h-6); g.lineTo(8,42); g.quadraticCurveTo(w/2,-14,w-8,42); g.lineTo(w-8,h-6); g.closePath(); };
    const grd=g.createRadialGradient(w/2,h*0.62,4,w/2,h*0.62,h*0.72);
    grd.addColorStop(0,'#fff3c4'); grd.addColorStop(0.45,'#ffc46a'); grd.addColorStop(1,'#c97a2e');
    arch(); g.fillStyle=grd; g.fill();
    g.strokeStyle='#3c2716'; g.lineWidth=7; g.stroke();
    g.lineWidth=5; g.beginPath(); g.moveTo(w/2,8); g.lineTo(w/2,h); g.moveTo(10,h*0.42); g.lineTo(w-10,h*0.42); g.moveTo(10,h*0.7); g.lineTo(w-10,h*0.7); g.stroke();
});

// ---- dark window ----
const darkWindowTex = makeTex(96,128,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    const arch = () => { g.beginPath(); g.moveTo(8,h-6); g.lineTo(8,42); g.quadraticCurveTo(w/2,-14,w-8,42); g.lineTo(w-8,h-6); g.closePath(); };
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,'#3a4a5c'); grd.addColorStop(0.4,'#1e2833'); grd.addColorStop(1,'#10161e');
    arch(); g.fillStyle=grd; g.fill();
    g.save(); arch(); g.clip();
    g.fillStyle='rgba(255,210,150,0.22)'; g.beginPath();
    g.moveTo(6,h*0.75); g.lineTo(w*0.62,0); g.lineTo(w*0.94,0); g.lineTo(w*0.32,h*0.75); g.closePath(); g.fill(); g.restore();
    g.strokeStyle='#241a12'; g.lineWidth=7; g.stroke();
    g.lineWidth=5; g.beginPath(); g.moveTo(w/2,8); g.lineTo(w/2,h); g.moveTo(10,h*0.42); g.lineTo(w-10,h*0.42); g.stroke();
});

// ---- church arch window (tall, warm) ----
const archWindowTex = makeTex(96,192,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    const arch = () => { g.beginPath(); g.moveTo(8,h-6); g.lineTo(8,52); g.quadraticCurveTo(w/2,-18,w-8,52); g.lineTo(w-8,h-6); g.closePath(); };
    const grd=g.createRadialGradient(w/2,h*0.55,4,w/2,h*0.55,h*0.7);
    grd.addColorStop(0,'#fff6cd'); grd.addColorStop(0.5,'#ffb95e'); grd.addColorStop(1,'#b85c22');
    arch(); g.fillStyle=grd; g.fill();
    g.strokeStyle='#2e2015'; g.lineWidth=6; g.stroke();
    g.lineWidth=4; g.beginPath(); g.moveTo(w/2,6); g.lineTo(w/2,h); g.moveTo(w*0.26,26); g.lineTo(w*0.26,h); g.moveTo(w*0.74,26); g.lineTo(w*0.74,h); g.stroke();
    g.beginPath(); g.arc(w/2,h*0.3,10,0,7); g.stroke();
});

// ---- awning stripes ----
function stripeTex(cA,cB){ return makeTex(128,128,(g,w,h)=>{
    const s=16;
    for(let x=0;x<w;x+=s){ g.fillStyle=((x/s)%2)?cA:cB; g.fillRect(x,0,s,h); }
    for(let x=0;x<w;x+=s){ g.fillStyle='rgba(0,0,0,0.18)'; g.fillRect(x+s-3,0,3,h); }
    speckle(g,w,h,120,0.15,'#fff','#000');
});}
const stripeRed    = stripeTex('#a8442f','#e5d7bd');
const stripeGreen  = stripeTex('#3f5a3a','#e5d7bd');
const stripeBlue   = stripeTex('#33506b','#e5d7bd');

// ---- windmill sail cloth ----
const sailTex = makeTex(128,256,(g,w,h)=>{
    g.fillStyle='#d3c6a8'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=36){ g.fillStyle='rgba(90,70,40,0.5)'; g.fillRect(0,y,w,3); }
    for(let i=0;i<26;i++){ g.fillStyle='rgba(110,88,52,0.28)';
        g.fillRect(rand()*w, rand()*h, rr(6,22), rr(6,20)); }
    speckle(g,w,h,220,0.3,'#f0e8d0','#5a4630');
});

// ---- normal-ish noise for water ----
const waterNoiseTex = makeTex(256,256,(g,w,h)=>{
    g.fillStyle='#8080ff'; g.fillRect(0,0,w,h);
    for(let i=0;i<140;i++){
        const x=rand()*w,y=rand()*h,r=rr(8,42);
        const grd=g.createRadialGradient(x,y,1,x,y,r);
        const nx=Math.floor(rr(96,160)), ny=Math.floor(rr(96,160));
        grd.addColorStop(0,`rgba(${nx},${ny},255,0.75)`);
        grd.addColorStop(1,'rgba(128,128,255,0)');
        g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
},{srgb:false, repeat:[5,5]});

// ============================================================
// 2. RENDERER / SCENE / CAMERA / FOG / SKY
// ============================================================
const SUN = new THREE.Vector3(-0.72, 0.165, -0.42).normalize();
const FOG_COLOR = new THREE.Color(0xd9a372);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;

const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms: { sunDir:{ value: SUN }, fogColor:{ value: FOG_COLOR } },
    vertexShader: `
        varying vec3 vDir;
        void main(){
            vDir = position;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_Position.z = gl_Position.w; // pin to far plane
        }`,
    fragmentShader: `
        varying vec3 vDir; uniform vec3 sunDir; uniform vec3 fogColor;
        void main(){
            vec3 d = normalize(vDir);
            float h = d.y;
            vec3 zen = vec3(0.145, 0.205, 0.385);
            vec3 mid = vec3(0.46, 0.315, 0.42);
            vec3 hor = vec3(0.99, 0.565, 0.27);
            vec3 col = mix(hor, mid, smoothstep(-0.02, 0.24, h));
            col = mix(col, zen, smoothstep(0.18, 0.62, h));
            col = mix(vec3(0.235, 0.155, 0.135), col, smoothstep(-0.22, 0.012, h));
            float sd = max(dot(d, sunDir), 0.0);
            float horizonWeight = 1.0 - smoothstep(0.05, 0.55, h);
            col = mix(col, vec3(1.16, 0.60, 0.27), pow(sd, 5.0) * 0.6 * horizonWeight);
            col += vec3(1.15, 0.68, 0.33) * pow(sd, 40.0) * 0.55;
            col += vec3(1.25, 0.82, 0.48) * pow(sd, 160.0) * 1.05;
            float disc = smoothstep(0.99930, 0.99962, sd);
            col += vec3(1.15, 0.97, 0.80) * disc * 3.6;
            col += fogColor * 0.22 * pow(1.0 - abs(h), 9.0);
            gl_FragColor = vec4(col, 1.0);
        }`
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(440, 40, 24), skyMat);

function plasterMat(tint){ return new THREE.MeshStandardMaterial({ map: plasterTex, bumpMap: plasterTex, bumpScale: 0.32, color: tint, roughness: 0.94 }); }
function roofMat(kind, tint){
    return kind === 'thatch'
        ? new THREE.MeshStandardMaterial({ map: thatchTex, bumpMap: thatchTex, bumpScale: 0.6, color: tint, roughness: 1 })
        : new THREE.MeshStandardMaterial({ map: roofTex, bumpMap: roofTex, bumpScale: 0.55, color: tint, roughness: 0.88 });
}
function addBox(parent, w,h,d, mat, x,y,z, cast=true){
    const m = new THREE.Mesh(boxGeo, mat);
    m.scale.set(w,h,d); m.position.set(x,y,z);
    m.castShadow = cast; m.receiveShadow = true;
    parent.add(m); return m;
}
const litWinMat  = new THREE.MeshStandardMaterial({ map: litWindowTex, emissive: 0xffc987, emissiveMap: litWindowTex, emissiveIntensity: 1.9, transparent: true, roughness: 0.6 });

// gable prism: triangle caps + sloped roof surfaces (multi-material)
function makeGablePrism(baseW, height, depth, gableMaterial, roofMaterial){
    const s = new THREE.Shape();
    s.moveTo(-baseW/2, 0); s.lineTo(baseW/2, 0); s.lineTo(0, height); s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false });
    geo.translate(0, 0, -depth/2);
    const mesh = new THREE.Mesh(geo, [gableMaterial, roofMaterial]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    return mesh;
}

function buildHouse(def){
    const g = new THREE.Group();
    const w = rr(3.6, 5.4), d = rr(3.6, 5.6);
    const floors = rand() < 0.42 ? 2 : (rand() < 0.75 ? 1 : 3);
    const floorH = 2.3, jetty = 0.22;
    const tint = pick(houseTints);
    const plaster = plasterMat(tint);
    const isThatch = rand() < 0.28;
    const roofM = roofMat(isThatch ? 'thatch' : 'tile', isThatch ? pick(thatchTints) : pick(roofTints));
    const gableM = new THREE.MeshStandardMaterial({ map: plasterGableTex, bumpMap: plasterTex, bumpScale: 0.3, color: tint, roughness: 0.94 });

    // stone foundation
    addBox(g, w + 0.35, 0.55, d + 0.35, new THREE.MeshStandardMaterial({ map: stoneTex, bumpMap: stoneTex, bumpScale: 0.6, roughness: 0.95 }), 0, 0.27, 0);

    const wallBottom = 0.55;
    // per-floor body (jettied upper floors overhang)
    for(let f=0; f<floors; f++){
        const fw = w + f*jetty*2, fd = d + f*jetty*2;
        const yBase = wallBottom + f*floorH;
        addBox(g, fw, floorH, fd, plaster, 0, yBase + floorH/2, 0);
        // corner posts
        const cs = 0.17;
        [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz]) =>
            addBox(g, cs, floorH + 0.06, cs, beamMat, sx*(fw/2), yBase + floorH/2, sz*(fd/2)));
        // top & bottom plates (front/back + sides)
        addBox(g, fw + 0.08, 0.17, 0.14, beamMat, 0, yBase + floorH - 0.1,  fd/2 + 0.015);
        addBox(g, fw + 0.08, 0.17, 0.14, beamMat, 0, yBase + 0.1,           fd/2 + 0.015);
        addBox(g, fw + 0.08, 0.17, 0.14, beamMat, 0, yBase + floorH - 0.1, -fd/2 - 0.015);
        addBox(g, fw + 0.08, 0.17, 0.14, beamMat, 0, yBase + 0.1,           -fd/2 - 0.015);
        addBox(g, 0.14, 0.17, fd + 0.08, beamMat,  fw/2 + 0.015, yBase + floorH - 0.1, 0);
        addBox(g, 0.14, 0.17, fd + 0.08, beamMat, -fw/2 - 0.015, yBase + floorH - 0.1, 0);
        // vertical studs
        const studs = Math.max(2, Math.floor(fw / 1.25));
        for(let s=1; s<studs; s++){
            const sx = -fw/2 + (fw/studs)*s;
            addBox(g, 0.11, floorH - 0.24, 0.1, beamMat, sx, yBase + floorH/2,  fd/2 + 0.012, false);
            addBox(g, 0.11, floorH - 0.24, 0.1, beamMat, sx, yBase + floorH/2, -fd/2 - 0.012, false);
        }
        // diagonal braces
        [-1,1].forEach(sx => {
            const brace = addBox(g, 0.1, floorH*0.78, 0.09, beamMat, sx*(fw/2 - 0.62), yBase + floorH/2, fd/2 + 0.012, false);
            brace.rotation.z = sx * 0.62;
        });
    }
    const wallTop = wallBottom + floors*floorH;
    const topW = w + (floors-1)*jetty*2, topD = d + (floors-1)*jetty*2;

    // roof
    const roofH = clamp(topW * rr(0.34, 0.44), 1.35, 2.6);
    const prism = makeGablePrism(topW + 0.85, roofH, topD + 0.85, gableM, roofM);
    prism.position.y = wallTop;
    g.add(prism);
    addBox(g, 0.18, 0.14, topD + 0.95, darkBeam, 0, wallTop + roofH + 0.02, 0, false); // ridge cap

    // windows (front & back faces)
    const winCols = Math.max(1, Math.floor(w / 1.55));
    for(let f=0; f<floors; f++){
        const fw = w + f*jetty*2, fd = d + f*jetty*2;
        const y = wallBottom + f*floorH + floorH*0.58;
        for(let c=0; c<winCols; c++){
            const wx = ((c + 0.5) / winCols - 0.5) * (fw - 1.1);
            [1,-1].forEach(side => {
                if (f === 0 && side === 1 && Math.abs(wx) < 0.75) return; // doorway gap
                const lit = rand() < 0.55;
                const frame = new THREE.Mesh(winFrameGeo, darkBeam);
                frame.position.set(wx, y, side*(fd/2 + 0.045));
                if (side < 0) frame.rotation.y = Math.PI;
                frame.castShadow = true; g.add(frame);
                const win = new THREE.Mesh(winGeo, lit ? litWinMat : darkWinMat);
                win.position.set(wx, y, side*(fd/2 + 0.095));
                if (side < 0) win.rotation.y = Math.PI;
                g.add(win);
                // sill
                addBox(g, 0.66, 0.06, 0.12, stoneTex ? new THREE.MeshStandardMaterial({map: stoneTex, color:0xcccccc, roughness:0.9}) : beamMat, wx, y - 0.47, side*(fd/2 + 0.06), false);
            });
        }
    }
    // attic round window in front gable
    const attic = new THREE.Mesh(new THREE.CircleGeometry(0.26, 14), rand()<0.6 ? litWinMat : darkWinMat);
    attic.position.set(0, wallTop + roofH*0.38, topD/2 + 0.435);
    g.add(attic);

    // door (front, faces +z before group rotation)
    const doorFrame = addBox(g, 1.06, 1.72, 0.12, beamMat, 0, wallBottom + 0.86, topD*0 + (d/2) + 0.05);
    doorFrame.scale.set(1.06, 1.72, 0.12);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(0.86, 1.52), doorMat);
    door.position.set(0, wallBottom + 0.78, d/2 + 0.115); door.castShadow = false; g.add(door);
    addBox(g, 1.25, 0.14, 0.45, new THREE.MeshStandardMaterial({ map: stoneTex, color: 0xbcbcbc, roughness: 0.9 }), 0, 0.09, d/2 + 0.28, false); // step

    // chimney (some houses) + register for smoke
    if (rand() < 0.62){
        const cx = rr(-topW/4, topW/4), cz = rr(-topD/4, topD/4);
        const chH = roofH*0.75 + rr(0.7, 1.3);
        const ch = addBox(g, 0.52, chH, 0.52, new THREE.MeshStandardMaterial({ map: stoneTex, bumpMap: stoneTex, bumpScale: 0.5, roughness: 0.95 }), cx, wallTop + roofH*0.55 + chH/2 - 0.4, cz);
        addBox(g, 0.68, 0.14, 0.68, darkBeam, cx, ch.position.y + chH/2 + 0.07, cz, false);
        g.updateMatrixWorld(true);
        const wp = new THREE.Vector3();
        ch.getWorldPosition(wp); wp.y += chH/2 + 0.15;
        g.userData.chimneyLocal = wp.clone(); // converted after placement
        g.userData.chimneyMesh = ch; g.userData.chimneyH = chH;
    }
    g.position.set(def.x, 0, def.z);
    g.rotation.y = def.rot;
    scene.add(g);
    g.updateMatrixWorld(true);
    if (g.userData.chimneyMesh){
        const wp = new THREE.Vector3();
        g.userData.chimneyMesh.getWorldPosition(wp);
        wp.y += g.userData.chimneyH/2 + 0.18;
        chimneySpots.push(wp);
    }
    return g;
}

// rejection test against village footprint
const housePts = houseDefs.map(d => ({x:d.x, z:d.z, r: 3.6}));
function segDist(px,pz, ax,az, bx,bz){
    const dx=bx-ax, dz=bz-az, L2 = dx*dx+dz*dz;
    let t = L2 ? ((px-ax)*dx + (pz-az)*dz)/L2 : 0; t = clamp(t, 0, 1);
    return Math.hypot(px-(ax+dx*t), pz-(az+dz*t));
}
function clearOfBuildings(x, z){
    if (Math.hypot(x, z) < 11.2) return false;                       // plaza
    if (Math.abs(x) < 3.7 && z > 3 && z < 47) return false;          // main street
    if (Math.abs(x) < 2.7 && z < 0.5 && z > -21) return false;       // church path
    if (segDist(x,z, 8.6,-6.4, 26.2,-11.6) < 2.5) return false;      // windmill path
    if (segDist(x,z, -8.2,5.4, -25.5,7.6) < 2.3) return false;       // lake path
    const ex = (x - LAKE.x)/(LAKE.rx+1.5), ez = (z - LAKE.z)/(LAKE.rz+1.5);
    if (ex*ex + ez*ez < 1.0) return false;                           // lake
    if (Math.abs(x) < 5.8 && z > -31.5 && z < -15.5) return false;   // church
    if (Math.hypot(x-29.5, z+12.5) < 8.0) return false;              // windmill mound
    for (const h of housePts) if (Math.hypot(x-h.x, z-h.z) < h.r) return false;
    return true;
}

{
    const trunkGeo = new THREE.CylinderGeometry(0.16, 0.30, 1.9, 8); trunkGeo.translate(0, 0.95, 0);
    const canopyGeo = new THREE.IcosahedronGeometry(1.35, 1);
    const cPos = canopyGeo.attributes.position; const v = new THREE.Vector3();
    for(let i=0;i<cPos.count;i++){
        v.fromBufferAttribute(cPos, i);
        const s = Math.sin(v.x*12.9898 + v.y*78.233 + v.z*37.719) * 43758.5453;
        const n = 0.8 + (s - Math.floor(s)) * 0.48;
        cPos.setXYZ(i, v.x*n, v.y*n*0.92, v.z*n);
    }
    canopyGeo.computeVertexNormals();
    const trunkMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x5e4630, roughness: 0.95 });
    const canopyMat = new THREE.MeshStandardMaterial({ map: foliageTex, roughness: 0.92, flatShading: true });
    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeSpots.length);
    const canopies = new THREE.InstancedMesh(canopyGeo, canopyMat, treeSpots.length*2);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), scl = new THREE.Vector3();
    const eul = new THREE.Euler();
    treeSpots.forEach((t, i) => {
        eul.set(0, rr(0,6.28), rr(-0.06,0.06)); q.setFromEuler(eul);
        m.compose(pos.set(t.x, 0, t.z), q, scl.set(t.s, t.s*rr(0.9,1.15), t.s));
        trunks.setMatrixAt(i, m);
        // lower canopy
        m.compose(pos.set(t.x, 2.35*t.s, t.z), q, scl.set(t.s*1.15, t.s*1.05, t.s*1.15));
        canopies.setMatrixAt(i*2, m);
        canopies.setColorAt(i*2, new THREE.Color(t.tint));
        // upper canopy
        m.compose(pos.set(t.x + rr(-0.3,0.3), 3.35*t.s, t.z + rr(-0.3,0.3)), q, scl.set(t.s*0.72, t.s*0.66, t.s*0.72));
        canopies.setMatrixAt(i*2+1, m);
        canopies.setColorAt(i*2+1, new THREE.Color(t.tint).multiplyScalar(1.18));
    });
    trunks.castShadow = true; canopies.castShadow = true;
    canopies.instanceColor.needsUpdate = true;

// 20. ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();
let elapsed = 0;
let loaderHidden = false;
const tmpV = new THREE.Vector3();

function animate(){
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    const t = elapsed;

    // windmill
    if (windmillRotor) windmillRotor.rotation.z += dt * 0.55;

    // water shimmer
    waterNoiseTex.offset.x = t * 0.018;
    waterNoiseTex.offset.y = t * 0.011;
    waterMat.normalScale.set(0.55 + Math.sin(t*0.7)*0.1, 0.55 + Math.cos(t*0.6)*0.1);

    // sun glint pulse on the lake
    waterMat.envMapIntensity = 1.5 + Math.sin(t * 0.5) * 0.25;

    // clouds drift
    for (const c of clouds){
        c.sprite.position.x += c.speed * dt;
        if (c.sprite.position.x > 280) c.sprite.position.x = -280;
    }

    // lantern flicker
    for (const L of lanternLights){
        L.light.intensity = L.base * (0.88 + 0.16 * Math.sin(t*9 + L.phase) * Math.sin(t*13.7 + L.phase*2.3) + 0.06*Math.sin(t*31 + L.phase));
    }
    for (const L of lanternGlowMats){
        const f = 0.85 + 0.18 * Math.sin(t*8.4 + L.phase) * Math.sin(t*12.1 + L.phase*1.7);
        L.glowMat.emissiveIntensity = 3.2 * f;
        L.haloMat.opacity = 0.62 * f;
    }

    // villagers walk
    for (const v of villagers){
        v.s += v.speed * dt;
        const u = (v.s / v.curveLen) % 1;
        const p = v.curve.getPointAt(u);
        const tan = v.curve.getTangentAt(u);
        v.group.position.set(p.x, 0, p.z);
        v.group.rotation.y = Math.atan2(tan.x, tan.z);
        v.phase += v.speed * dt * 3.4;
        const swing = Math.sin(v.phase);
        v.legL.rotation.x = swing * 0.72;
        v.legR.rotation.x = -swing * 0.72;
        v.armL.rotation.x = -swing * 0.5;
        v.armR.rotation.x = swing * 0.5;
        v.group.position.y = Math.abs(Math.cos(v.phase)) * 0.07;
        v.group.rotation.z = Math.sin(v.phase) * 0.03;
    }
    // chattering villagers — subtle idle motion
    for (const v of chatters){
        v.group.rotation.y += Math.sin(t*0.6 + v.phase) * 0.0009;
        v.armR.rotation.x = Math.sin(t*1.4 + v.phase) * 0.22 - 0.25; // gesturing
        v.group.position.y = Math.abs(Math.sin(t*1.1 + v.phase)) * 0.02;
    }

    // birds — banked ellipses with flapping wings
    for (const b of birds){
        b.a += b.speed * dt;
        const x = Math.cos(b.a) * b.radius, z = Math.sin(b.a) * b.radius * 0.72 + b.cz;
        const y = b.height + Math.sin(t*0.6 + b.phase) * 1.6 + Math.sin(b.a*2.0) * 0.9;
        b.g.position.set(x, y, z);
        b.g.rotation.y = Math.atan2(-Math.sin(b.a)*b.radius, Math.cos(b.a)*b.radius*0.72) + Math.PI;
        b.g.rotation.z = Math.sin(t*0.8 + b.phase) * 0.14; // bank
        const flap = Math.sin(t * b.flap + b.phase) * 0.62;
        b.wr.rotation.y = 0; b.wr.rotation.z = flap;
        b.wl.rotation.z = -flap;
    }

    // fireflies — lazy wandering pulses
    {
        const pos = fireflyGeo.attributes.position;
        for(let i=0;i<fireflyBase.length;i++){
            const f = fireflyBase[i];
            pos.setXYZ(i,
                f.x + Math.sin(t*f.sp + f.ph) * f.amp,
                f.y + Math.sin(t*f.sp*1.7 + f.ph*2.1) * f.amp * 0.55,
                f.z + Math.cos(t*f.sp*0.8 + f.ph) * f.amp
            );
        }
        pos.needsUpdate = true;
        fireflyGeo.userData.mat.opacity = 0.65 + 0.3 * Math.sin(t * 1.3);
    }

    // chimney smoke
    for(let i=0;i<chimneySpots.length;i++){
        chimneyTimers[i] -= dt;
        if (chimneyTimers[i] <= 0){
            chimneyTimers[i] = rr(0.22, 0.42);
            const s = smokePool.find(p => p.life <= 0);
            if (s){
                s.maxLife = rr(2.9, 4.4); s.life = s.maxLife;
                s.sprite.visible = true;
                s.sprite.position.copy(chimneySpots[i]).add(tmpV.set(rr(-0.12,0.12), rr(0,0.1), rr(-0.12,0.12)));
                s.vel.set(rr(0.42, 0.62), rr(0.95, 1.3), rr(0.06, 0.2));
                s.size = rr(0.45, 0.75);
            }
        }
    }
    for (const s of smokePool){
        if (s.life <= 0) continue;
        s.life -= dt;
        if (s.life <= 0){ s.sprite.visible = false; s.sprite.material.opacity = 0; continue; }
        const age = 1 - s.life / s.maxLife;
        s.vel.x += dt * 0.22; // wind shear
        s.sprite.position.addScaledVector(s.vel, dt);
        const sc = s.size * (0.7 + age * 3.1);
        s.sprite.scale.set(sc, sc, 1);
        s.sprite.material.opacity = 0.4 * (1 - age) * Math.min(1, age / 0.13);
        // warm-tinted near the flue, cooling as it rises
        s.sprite.material.color.setHex(age < 0.3 ? 0xc9beb2 : 0xaaa29a);
    }

    controls.update();
    composer.render();

    if (!loaderHidden){
        loaderHidden = true;
        const loader = document.getElementById('loader');
        loader.classList.add('done');
        setTimeout(() => loader.remove(), 1100);
    }
}
renderer.setAnimationLoop(animate);

// ============================================================
// 21. RESIZE
// ============================================================
addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
    bloom.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
