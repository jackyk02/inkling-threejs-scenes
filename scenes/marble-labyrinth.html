<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble Labyrinth — A Tabletop Trial of Patience</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%238a5a33'/><circle cx='50' cy='50' r='20' fill='%23451f22'/><circle cx='42' cy='42' r='7' fill='%23c9a86a'/></svg>">
<style>
  :root{
    --brass:#c9a86a;
    --brass-dim:rgba(201,168,106,.4);
    --cream:#ece1c8;
    --cream-hi:#f7eed6;
    --sage:#9db3a0;
    --panel:rgba(13,18,16,.86);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d100f;font-family:Georgia,'Times New Roman',serif;color:var(--cream)}
  canvas{display:block}

  .panel{
    background:linear-gradient(165deg,rgba(21,29,25,.9),rgba(11,15,13,.88));
    border:1px solid var(--brass-dim);
    border-radius:12px;
    box-shadow:0 16px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  /* ---------- HUD : top left ---------- */
  #hudLeft{position:absolute;top:18px;left:18px;padding:14px 20px 13px;min-width:236px;user-select:none;pointer-events:none;z-index:5}
  .eyebrow{font-size:9px;letter-spacing:.34em;color:var(--brass);text-transform:uppercase}
  .title{font-size:20px;letter-spacing:.16em;margin:3px 0 11px;color:var(--cream-hi);font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .stats{display:flex;gap:22px;border-top:1px solid rgba(201,168,106,.25);padding-top:10px}
  .stat .label{display:block;font-size:9px;letter-spacing:.3em;color:var(--sage);margin-bottom:2px}
  .stat .value{font-family:'Courier New',Courier,monospace;font-size:19px;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .stat .value.gold{color:var(--brass)}

  /* ---------- HUD : top right ---------- */
  #hudRight{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:9px;z-index:5}
  .btn{
    cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:#241a08;background:linear-gradient(180deg,#ecd08a,#c39a48 60%,#a87c34);
    border:1px solid #7d5f22;border-radius:9px;padding:11px 18px;
    box-shadow:0 5px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.65);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 9px 26px rgba(201,168,106,.35), inset 0 1px 0 rgba(255,255,255,.65)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:rgba(18,25,22,.88);color:var(--cream);border:1px solid var(--brass-dim);box-shadow:0 5px 16px rgba(0,0,0,.5)}
  .btn.ghost:hover{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(201,168,106,.35)}
  .key{display:inline-block;margin-left:10px;padding:1px 7px;border-radius:4px;border:1px solid rgba(0,0,0,.4);background:rgba(0,0,0,.22);font-size:10px;letter-spacing:.1em}
  .ghost .key{border-color:var(--brass-dim);background:rgba(201,168,106,.12);color:var(--brass)}

  /* ---------- hint pill ---------- */
  #hint{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;
    font-size:11.5px;letter-spacing:.07em;color:#cfe0cd;white-space:nowrap;
    background:rgba(12,17,15,.78);border:1px solid rgba(201,168,106,.28);
    padding:9px 22px;border-radius:999px;backdrop-filter:blur(6px)
  }
  #hint b{color:var(--brass);font-weight:600}

  /* ---------- fall flash ---------- */
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .14s ease;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(158,26,12,.55) 100%)}
  #flash.active{opacity:.65}

  /* ---------- win overlay ---------- */
  #winOverlay{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,14,12,.32) 0%, rgba(4,6,5,.8) 100%);
    opacity:0;pointer-events:none;transition:opacity .45s ease
  }
  #winOverlay.visible{opacity:1;pointer-events:auto}
  .win-panel{text-align:center;padding:36px 60px 30px;transform:translateY(16px) scale(.96);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
  #winOverlay.visible .win-panel{transform:none}
  .win-kicker{font-size:10px;letter-spacing:.42em;color:var(--brass);text-transform:uppercase}
  .win-title{font-size:46px;letter-spacing:.1em;margin:8px 0 4px;color:var(--cream-hi);text-shadow:0 0 34px rgba(201,168,106,.35)}
  .win-sub{font-size:11.5px;letter-spacing:.1em;color:var(--sage);margin-bottom:20px}
  .win-stats{display:flex;gap:34px;justify-content:center;border-top:1px solid rgba(201,168,106,.28);border-bottom:1px solid rgba(201,168,106,.28);padding:14px 6px;margin-bottom:22px}
  .win-stats .label{font-size:9px;letter-spacing:.3em;color:var(--sage);display:block;margin-bottom:3px}
  .win-stats .value{font-family:'Courier New',monospace;font-size:23px;color:#fff}
  .win-stats .value.gold{color:var(--brass)}
  .btn.big{font-size:12px;padding:14px 30px}
  .best-note{font-size:10px;letter-spacing:.24em;color:var(--brass);margin-top:14px;text-transform:uppercase;height:14px}

  @media (max-width:640px){
    #hint{display:none}
    .title{font-size:16px}
    #hudLeft{min-width:0;padding:10px 14px}
    .win-title{font-size:34px}
  }
</style>
</head>
<body>

<!-- ============ HUD ============ -->
<div id="hudLeft" class="panel">
  <div class="eyebrow">Tabletop No. 7</div>
  <div class="title">MARBLE LABYRINTH</div>
  <div class="stats">
    <div class="stat"><span class="label">Time</span><span id="hudTime" class="value">00:00.0</span></div>
    <div class="stat"><span class="label">Falls</span><span id="hudFalls" class="value">0</span></div>
    <div class="stat"><span class="label">Best</span><span id="hudBest" class="value gold">—</span></div>
  </div>
</div>

<div id="hudRight">
  <button id="restartBtn" class="btn">Restart<span class="key">R</span></button>
  <button id="soundBtn" class="btn ghost">Sound On</button>
</div>

<div id="hint">Tilt with <b>Arrow Keys</b> or <b>drag</b> the board &nbsp;·&nbsp; <b>R</b> restarts &nbsp;·&nbsp; spare the holes</div>
<div id="flash"></div>

<div id="winOverlay" aria-hidden="true">
  <div class="win-panel panel">
    <div class="win-kicker">The Marble Rests</div>
    <h1 class="win-title">YOU WIN</h1>
    <div class="win-sub">A steady hand and a quiet mouse.</div>
    <div class="win-stats">
      <div class="stat"><span class="label">Time</span><span id="winTime" class="value">00:00.0</span></div>
      <div class="stat"><span class="label">Falls</span><span id="winFalls" class="value">0</span></div>
      <div class="stat"><span class="label">Best</span><span id="winBest" class="value gold">—</span></div>
    </div>
    <button id="againBtn" class="btn big">Play Again<span class="key">R</span></button>
    <div class="best-note" id="bestNote"></div>
  </div>
</div>

<canvas id="scene"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0.  RENDERER / SCENE / CAMERA / CONTROLS
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1513);
scene.fog = new THREE.Fog(0x0e1513, 78, 195);

const camera = new THREE.PerspectiveCamera(37, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 24.6, 21.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 12;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.46;
controls.enabled = false;                 // disabled during play — freed after victory

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/* ============================================================
   1.  PROCEDURAL TEXTURES (canvas — no external assets)
   ============================================================ */
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, { srgb = true, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = MAX_ANISO;
  return t;
}

/* --- warm wood with grain, bands, knots --- */
function woodCanvas({ w = 1024, h = 768, base = '#8a5632', dark = '#54311c', light = '#c79a68', lines = 220, knots = 5, planks = 0 } = {}) {
  const c = makeCanvas(w, h), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  // broad tonal bands across the grain
  for (let i = 0; i < 26; i++) {
    const px = Math.random() * w, pw = 40 + Math.random() * 170;
    const col = Math.random() < 0.5 ? dark : light;
    const g = x.createLinearGradient(px, 0, px + pw, 0);
    g.addColorStop(0, hexA(col, 0)); g.addColorStop(0.5, hexA(col, 0.10 + Math.random() * 0.17)); g.addColorStop(1, hexA(col, 0));
    x.fillStyle = g; x.fillRect(px, 0, pw, h);
  }
  // long sweeping grain lines
  for (let i = 0; i < lines; i++) {
    const y0 = Math.random() * h, amp = 2 + Math.random() * 10;
    x.beginPath(); x.moveTo(-30, y0);
    x.bezierCurveTo(w * 0.3, y0 + (Math.random() - 0.5) * amp * 2,
                    w * 0.7, y0 + (Math.random() - 0.5) * amp * 2,
                    w + 30, y0 + (Math.random() - 0.5) * amp * 1.5);
    x.strokeStyle = hexA(Math.random() < 0.78 ? dark : light, 0.10 + Math.random() * 0.26);
    x.lineWidth = 0.5 + Math.random() * 2.6;
    x.stroke();
  }
  // fine hair grain
  for (let i = 0; i < lines * 2; i++) {
    const y0 = Math.random() * h;
    x.beginPath(); x.moveTo(0, y0); x.lineTo(w, y0 + (Math.random() - 0.5) * 7);
    x.strokeStyle = hexA(dark, 0.05 + Math.random() * 0.09);
    x.lineWidth = 0.4 + Math.random() * 0.8; x.stroke();
  }
  // knots
  for (let i = 0; i < knots; i++) {
    const kx = Math.random() * w, ky = Math.random() * h, kr = 9 + Math.random() * 22;
    for (let r = kr; r > 0; r -= 2.4) {
      x.beginPath(); x.ellipse(kx, ky, r * 1.7, r, 0, 0, Math.PI * 2);
      x.strokeStyle = hexA(dark, 0.15 + Math.random() * 0.15);
      x.lineWidth = 1 + Math.random() * 1.2; x.stroke();
    }
    const kg = x.createRadialGradient(kx, ky, 0, kx, ky, kr);
    kg.addColorStop(0, hexA('#241207', 0.9)); kg.addColorStop(1, hexA('#241207', 0));
    x.fillStyle = kg; x.beginPath(); x.ellipse(kx, ky, kr * 1.5, kr * 0.85, 0, 0, Math.PI * 2); x.fill();
  }
  if (planks > 0) {
    const step = w / planks;
    for (let i = 1; i < planks; i++) {
      x.fillStyle = hexA('#180d06', 0.6); x.fillRect(i * step - 1.5, 0, 3, h);
      x.fillStyle = hexA('#d8b184', 0.10); x.fillRect(i * step + 1.5, 0, 2, h);
    }
  }
  // soft vignette
  const vg = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.42, w / 2, h / 2, Math.max(w, h) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.3)');
  x.fillStyle = vg; x.fillRect(0, 0, w, h);
  return c;
}

/* --- felt --- */
function feltCanvas(base = '#1f4a30') {
  const c = makeCanvas(256, 256), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6500; i++) {
    x.fillStyle = hexA(Math.random() < 0.5 ? '#0c2416' : '#3f7050', 0.08 + Math.random() * 0.2);
    const s = 0.6 + Math.random() * 1.7;
    x.fillRect(Math.random() * 256, Math.random() * 256, s, s);
  }
  return c;
}

/* --- radial fake-depth for the holes --- */
function holeCanvas() {
  const c = makeCanvas(256, 256), x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 2, 128, 128, 128);
  g.addColorStop(0.00, '#000000');
  g.addColorStop(0.45, '#020202');
  g.addColorStop(0.74, '#0b0b0b');
  g.addColorStop(0.90, '#1e1e1e');
  g.addColorStop(1.00, '#050505');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return c;
}

/* --- floor planks --- */
function floorCanvas() {
  const c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#2c2015'; x.fillRect(0, 0, 512, 512);
  const rows = 4;
  for (let r = 0; r < rows; r++) {
    const y = r * 128;
    x.fillStyle = ['#33241a', '#2b1f15', '#382a1e', '#2e221a'][r % 4];
    x.fillRect(0, y, 512, 128);
    for (let i = 0; i < 46; i++) {
      const yy = y + Math.random() * 128;
      x.beginPath(); x.moveTo(0, yy); x.lineTo(512, yy + (Math.random() - 0.5) * 5);
      x.strokeStyle = hexA('#160d07', 0.12 + Math.random() * 0.22);
      x.lineWidth = 0.5 + Math.random() * 1.6; x.stroke();
    }
    x.fillStyle = hexA('#120a05', 0.85); x.fillRect(0, y, 512, 3);
    x.fillStyle = hexA('#c9a86a', 0.05); x.fillRect(0, y + 3, 512, 2);
    const seam = (r * 197 + 130) % 512;
    x.fillStyle = hexA('#120a05', 0.7); x.fillRect(seam, y, 3, 128);
  }
  return c;
}

/* --- plaster wall with faint panel stripes --- */
function wallCanvas() {
  const c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#24322f'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 5200; i++) {
    x.fillStyle = hexA(Math.random() < 0.5 ? '#141d1b' : '#3a4c48', 0.05 + Math.random() * 0.12);
    x.fillRect(Math.random() * 512, Math.random() * 512, 1.5, 1.5);
  }
  for (let px = 0; px < 512; px += 128) {
    x.fillStyle = hexA('#141d1b', 0.5); x.fillRect(px, 0, 2, 512);
    x.fillStyle = hexA('#546a63', 0.22); x.fillRect(px + 2, 0, 2, 512);
  }
  const g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(0.35, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  return c;
}

/* --- circular oxblood rug with gold medallion --- */
function rugCanvas() {
  const c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#3d1d1f'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 4000; i++) {
    x.fillStyle = hexA(Math.random() < 0.5 ? '#210f10' : '#5c2f31', 0.15 + Math.random() * 0.2);
    x.fillRect(Math.random() * 512, Math.random() * 512, 1.6, 1.6);
  }
  const ring = (r, lw, col, a) => { x.beginPath(); x.arc(256, 256, r, 0, Math.PI * 2); x.strokeStyle = hexA(col, a); x.lineWidth = lw; x.stroke(); };
  ring(246, 15, '#b98a4a', 0.85); ring(226, 2.5, '#e3c87e', 0.8);
  ring(172, 3, '#b98a4a', 0.55); ring(120, 2, '#b98a4a', 0.4);
  ring(46, 4, '#e3c87e', 0.75);
  x.beginPath(); x.arc(256, 256, 26, 0, Math.PI * 2); x.fillStyle = hexA('#57262a', 0.9); x.fill();
  // diamond motif dots between the rings
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2, rr = 198;
    const dx = 256 + Math.cos(a) * rr, dy = 256 + Math.sin(a) * rr;
    x.save(); x.translate(dx, dy); x.rotate(a);
    x.fillStyle = hexA('#d9b96a', 0.6); x.fillRect(-4, -4, 8, 8); x.restore();
  }
  return c;
}

/* --- procedural paintings --- */
function paintingMountain() {
  const c = makeCanvas(512, 384), x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, 384);
  sky.addColorStop(0, '#282a4c'); sky.addColorStop(0.42, '#6e3d54'); sky.addColorStop(0.72, '#c9743f'); sky.addColorStop(0.9, '#e8a45c');
  x.fillStyle = sky; x.fillRect(0, 0, 512, 384);
  const sun = x.createRadialGradient(348, 226, 2, 348, 226, 92);
  sun.addColorStop(0, '#ffe9b2'); sun.addColorStop(0.35, '#ffd184'); sun.addColorStop(1, 'rgba(255,209,132,0)');
  x.fillStyle = sun; x.fillRect(0, 0, 512, 384);
  const ridge = (pts, col) => { x.beginPath(); x.moveTo(0, 384); x.lineTo(0, pts[0]); for (const [px, py] of pts) x.lineTo(px, py); x.lineTo(512, pts[pts.length - 1]); x.lineTo(512, 384); x.closePath(); x.fillStyle = col; x.fill(); };
  ridge([[90, 250], [170, 196], [255, 246], [338, 208], [430, 252], [512, 232]], '#43304d');
  ridge([[70, 300], [160, 240], [268, 296], [352, 252], [462, 302], [512, 282]], '#2c2033');
  ridge([[40, 344], [150, 288], [260, 340], [380, 296], [512, 344]], '#181020');
  x.strokeStyle = 'rgba(20,14,22,.85)'; x.lineWidth = 2;
  for (const [bx, by] of [[140, 120], [190, 96], [232, 132]]) {
    x.beginPath(); x.moveTo(bx - 9, by); x.quadraticCurveTo(bx - 3, by - 6, bx, by); x.quadraticCurveTo(bx + 3, by - 6, bx + 9, by); x.stroke();
  }
  for (let i = 0; i < 1600; i++) { x.fillStyle = hexA(Math.random() < 0.5 ? '#000' : '#fff', 0.03 + Math.random() * 0.05); x.fillRect(Math.random() * 512, Math.random() * 384, 1.4, 1.4); }
  x.strokeStyle = '#0e0a08'; x.lineWidth = 14; x.strokeRect(0, 0, 512, 384);
  return c;
}
function paintingAbstract() {
  const c = makeCanvas(512, 384), x = c.getContext('2d');
  x.fillStyle = '#16302a'; x.fillRect(0, 0, 512, 384);
  for (let i = 0; i < 2600; i++) { x.fillStyle = hexA(Math.random() < 0.5 ? '#0a1a16' : '#2c4a40', 0.2 + Math.random() * 0.25); x.fillRect(Math.random() * 512, Math.random() * 384, 1.5, 1.5); }
  for (let i = 0; i < 9; i++) {
    const gx = 40 + Math.random() * 430;
    x.strokeStyle = hexA('#d4af37', 0.28 + Math.random() * 0.45); x.lineWidth = 2 + Math.random() * 5;
    x.beginPath(); x.moveTo(gx, 20); x.lineTo(gx + (Math.random() - 0.5) * 60, 364); x.stroke();
  }
  const disc = (dx, dy, r, col, a) => { x.beginPath(); x.arc(dx, dy, r, 0, Math.PI * 2); x.fillStyle = hexA(col, a); x.fill(); x.strokeStyle = hexA('#0e1a16', .8); x.lineWidth = 3; x.stroke(); };
  disc(150, 148, 62, '#d4af37', 0.92); disc(150, 148, 30, '#f0d98a', 0.95);
  disc(330, 240, 78, '#b56f2c', 0.9);  disc(356, 214, 26, '#e8dcc4', 0.9);
  disc(392, 110, 34, '#8a2f2a', 0.9);
  x.beginPath(); x.arc(256, 192, 120, Math.PI * 0.15, Math.PI * 1.1);
  x.strokeStyle = hexA('#e3c87e', 0.8); x.lineWidth = 10; x.stroke();
  x.strokeStyle = '#0e0a08'; x.lineWidth = 14; x.strokeRect(0, 0, 512, 384);
  return c;
}

/* --- wall clock face --- */
function clockCanvas() {
  const c = makeCanvas(256, 256), x = c.getContext('2d');
  x.fillStyle = '#ece2c4'; x.beginPath(); x.arc(128, 128, 128, 0, Math.PI * 2); x.fill();
  const rim = x.createRadialGradient(128, 128, 96, 128, 128, 128);
  rim.addColorStop(0, '#6e4f22'); rim.addColorStop(0.75, '#a87c34'); rim.addColorStop(1, '#3c2a0e');
  x.fillStyle = rim; x.beginPath(); x.arc(128, 128, 128, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#ece2c4'; x.beginPath(); x.arc(128, 128, 100, 0, Math.PI * 2); x.fill();
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2, big = i % 5 === 0;
    const r1 = big ? 74 : 86, r2 = 94;
    x.beginPath();
    x.moveTo(128 + Math.cos(a) * r1, 128 + Math.sin(a) * r1);
    x.lineTo(128 + Math.cos(a) * r2, 128 + Math.sin(a) * r2);
    x.strokeStyle = '#33302a'; x.lineWidth = big ? 5 : 2; x.stroke();
  }
  x.beginPath(); x.arc(128, 128, 96, 0, Math.PI * 2); x.strokeStyle = '#6e4f22'; x.lineWidth = 3; x.stroke();
  return c;
}

/* --- checkered flag --- */
function flagCanvas() {
  const c = makeCanvas(128, 88), x = c.getContext('2d');
  const s = 16;
  for (let r = 0; r < 6; r++) for (let i = 0; i < 8; i++) {
    x.fillStyle = (r + i) % 2 ? '#141414' : '#f2ead8';
    x.fillRect(i * s, r * s, s, s);
  }
  const g = x.createLinearGradient(0, 0, 0, 88);
  g.addColorStop(0, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(0,0,0,.3)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 88);
  return c;
}

/* --- brass plaque engraving --- */
function plaqueCanvas() {
  const c = makeCanvas(1024, 160), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1024, 0);
  g.addColorStop(0, '#7c5a1e'); g.addColorStop(0.18, '#c9a227'); g.addColorStop(0.38, '#f0d98a');
  g.addColorStop(0.55, '#a87c34'); g.addColorStop(0.78, '#e6c877'); g.addColorStop(1, '#6e4f22');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 160);
  x.strokeStyle = 'rgba(40,26,6,.85)'; x.lineWidth = 6; x.strokeRect(8, 8, 1008, 144);
  try { x.letterSpacing = '18px'; } catch (e) { /* older engines */ }
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '600 64px Georgia, serif';
  x.fillStyle = 'rgba(255,244,200,.75)'; x.fillText('MARBLE  LABYRINTH', 512, 86);

}

const MARBLE_R = 0.55;
const marbleMesh = new THREE.Mesh(new THREE.SphereGeometry(MARBLE_R, 48, 32), MAT.steel);
marbleMesh.castShadow = true;
marbleMesh.position.set(START.x, MARBLE_R, START.z);
boardGroup.add(marbleMesh);

/* ============================================================
   6.  POST-PROCESSING — subtle bloom for the glowing bits
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   7.  GAME STATE, PHYSICS, INPUT
   ============================================================ */
const G = 30;                    // gravity along the board (tuned, feels like 32cm marble)
const RESTITUTION = 0.42;        // bounciness off walls
const MAX_TILT = THREE.MathUtils.degToRad(12);
const CATCH_R = 0.40;            // centre-over-hole threshold
const BOUND_X = 13.0 - MARBLE_R, BOUND_Z = 9.0 - MARBLE_R;

let state = 'playing';           // 'playing' | 'fell' | 'won'
let elapsed = 0, falls = 0;
let best = NaN;
try { best = parseFloat(localStorage.getItem('marbleLabyrinth.best')); } catch (e) { /* private mode */ }

const marble = { x: START.x, z: START.z, vx: 0, vz: 0 };
let fallVy = 0, fallTarget = { x: 0, z: 0 }, fallTimer = 0;
let winTimer = 0, overlayShown = false;

const tiltTarget = new THREE.Vector2(0, 0);   // (rx, rz)
const tilt = new THREE.Vector2(0, 0);

/* ---------- input : keyboard ---------- */
const keys = new Set();
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (e.key === 'r' || e.key === 'R') { restart(); return; }
  keys.add(e.key);
  initAudio();
});
window.addEventListener('keyup', (e) => keys.delete(e.key));
window.addEventListener('blur', () => keys.clear());

/* ---------- input : pointer drag tilts the board ---------- */
let dragging = false, dragStart = { x: 0, y: 0 }, tiltAtDragStart = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  dragStart.x = e.clientX; dragStart.y = e.clientY;
  tiltAtDragStart.copy(tiltTarget);
  renderer.domElement.setPointerCapture(e.pointerId);
  initAudio();
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  tiltTarget.x = THREE.MathUtils.clamp(tiltAtDragStart.x + dy * 0.0044, -MAX_TILT, MAX_TILT);
  tiltTarget.y = THREE.MathUtils.clamp(tiltAtDragStart.y - dx * 0.0044, -MAX_TILT, MAX_TILT);
});
const endDrag = () => { dragging = false; };
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ---------- tiny procedural audio ---------- */
let audioCtx = null, muted = false, lastThud = -10;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio */ } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur = 0.15, type = 'sine', vol = 0.15, slideTo = null, delay = 0) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sndThud = () => tone(150 + Math.random() * 70, 0.055, 'triangle', 0.07);
const sndFall = () => { tone(400, 0.55, 'sine', 0.2, 62); tone(180, 0.4, 'triangle', 0.1, 55, 0.08); };
const sndClick = () => tone(680, 0.06, 'square', 0.05);
const sndWin = () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.42, 'triangle', 0.16, null, i * 0.13)); };

/* ---------- DOM handles & HUD ---------- */
const hudTime = document.getElementById('hudTime');
const hudFalls = document.getElementById('hudFalls');
const hudBest = document.getElementById('hudBest');
const winOverlay = document.getElementById('winOverlay');
const winTime = document.getElementById('winTime');
const winFalls = document.getElementById('winFalls');
const winBest = document.getElementById('winBest');
const bestNote = document.getElementById('bestNote');
const flashEl = document.getElementById('flash');
const soundBtn = document.getElementById('soundBtn');

const fmtTime = (t) => {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t % 1) * 10);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${d}`;
};
const bestLabel = () => Number.isFinite(best) ? fmtTime(best) : '—';
let lastTimeStr = '';
function updateHUD() {
  const ts = fmtTime(elapsed);
  if (ts !== lastTimeStr) { hudTime.textContent = ts; lastTimeStr = ts; }
  hudFalls.textContent = String(falls);
  hudBest.textContent = bestLabel();
}

function resetMarble() {
  marble.x = START.x; marble.z = START.z; marble.vx = 0; marble.vz = 0;
  fallVy = 0;
  marbleMesh.position.set(START.x, MARBLE_R, START.z);
  marbleMesh.quaternion.identity();
}
function restart() {
  state = 'playing'; elapsed = 0; falls = 0; winTimer = 0; overlayShown = false;
  lastTimeStr = '';
  resetMarble();
  winOverlay.classList.remove('visible');
  controls.enabled = false;
  updateHUD();
  sndClick();
}
function startFall(hx, hz) {
  state = 'fell'; falls++; fallTarget = { x: hx, z: hz };
  fallVy = 1.2; fallTimer = 0;
  flashEl.classList.add('active');
  setTimeout(() => flashEl.classList.remove('active'), 150);
  sndFall();
  updateHUD();
}
function winGame() {
  state = 'won'; fallTarget = { x: GOAL.x, z: GOAL.z };
  fallVy = 0.6; winTimer = 0; overlayShown = false;
  spawnWinBurst();
  sndWin();
  let newBest = false;
  if (!Number.isFinite(best) || elapsed < best) {
    best = elapsed; newBest = true;
    try { localStorage.setItem('marbleLabyrinth.best', String(best)); } catch (e) { /* private mode */ }
  }
  bestNote.textContent = newBest ? 'A New Bench Record' : '';
  winTime.textContent = fmtTime(elapsed);
  winFalls.textContent = String(falls);
  winBest.textContent = bestLabel();
  controls.enabled = false; // freed once the overlay shows
  updateHUD();
}

document.getElementById('restartBtn').addEventListener('click', () => { initAudio(); restart(); });
document.getElementById('againBtn').addEventListener('click', () => { initAudio(); restart(); });
soundBtn.addEventListener('click', () => {
  muted = !muted;
  soundBtn.textContent = muted ? 'Sound Off' : 'Sound On';
  if (!muted) sndClick();
});

/* ---------- win burst particles ---------- */
const P_COUNT = 130;
const pPos = new Float32Array(P_COUNT * 3);
const pVel = new Float32Array(P_COUNT * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0xffd76a, size: 0.22, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
const winPoints = new THREE.Points(pGeo, pMat);
winPoints.visible = false; winPoints.frustumCulled = false; scene.add(winPoints);
let pLife = 0;
const _goalWorld = new THREE.Vector3();
function spawnWinBurst() {
  _goalWorld.set(GOAL.x, 0.6, GOAL.z);
  boardGroup.localToWorld(_goalWorld);
  for (let i = 0; i < P_COUNT; i++) {
    pPos[i * 3] = _goalWorld.x; pPos[i * 3 + 1] = _goalWorld.y; pPos[i * 3 + 2] = _goalWorld.z;
    const a = Math.random() * Math.PI * 2, up = 3.2 + Math.random() * 5.2, out = 1.2 + Math.random() * 3.4;
    pVel[i * 3] = Math.cos(a) * out; pVel[i * 3 + 1] = up; pVel[i * 3 + 2] = Math.sin(a) * out;
  }
  pLife = 1.7; pMat.opacity = 1; winPoints.visible = true;
  pGeo.attributes.position.needsUpdate = true;
}
function updateWinParticles(dt) {
  if (!winPoints.visible) return;
  pLife -= dt;
  for (let i = 0; i < P_COUNT; i++) {
    pVel[i * 3 + 1] -= 11.5 * dt;
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = THREE.MathUtils.clamp(pLife / 1.15, 0, 1);
  if (pLife <= 0) winPoints.visible = false;
}

/* ---------- physics step ---------- */
const _axis = new THREE.Vector3(), _q = new THREE.Quaternion();
let simTime = 0;

function collideWalls() {
  for (const w of walls) {
    const cx = Math.max(w.minX, Math.min(marble.x, w.maxX));
    const cz = Math.max(w.minZ, Math.min(marble.z, w.maxZ));
    let dx = marble.x - cx, dz = marble.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= MARBLE_R * MARBLE_R) continue;
    let nx, nz, pen;
    if (d2 === 0) {
      const l = marble.x - w.minX, rr = w.maxX - marble.x, t = marble.z - w.minZ, b = w.maxZ - marble.z;
      const m = Math.min(l, rr, t, b);
      if (m === l) { nx = -1; nz = 0; pen = l + MARBLE_R; }
      else if (m === rr) { nx = 1; nz = 0; pen = rr + MARBLE_R; }
      else if (m === t) { nx = 0; nz = -1; pen = t + MARBLE_R; }
      else { nx = 0; nz = 1; pen = b + MARBLE_R; }
    } else {
      const d = Math.sqrt(d2); nx = dx / d; nz = dz / d; pen = MARBLE_R - d;
    }
    marble.x += nx * pen; marble.z += nz * pen;
    const vn = marble.vx * nx + marble.vz * nz;
    if (vn < 0) {
      marble.vx -= (1 + RESTITUTION) * vn * nx;
      marble.vz -= (1 + RESTITUTION) * vn * nz;
      marble.vx *= 0.985; marble.vz *= 0.985;   // a whisper of wall friction
      if (vn < -2.3 && simTime - lastThud > 0.09) { lastThud = simTime; sndThud(); }
    }
  }
  // frame (outer boundary)
  if (marble.x < -BOUND_X) { marble.x = -BOUND_X; if (marble.vx < 0) { marble.vx = -marble.vx * RESTITUTION; if (marble.vx < -2.3) sndThud(); } }
  else if (marble.x > BOUND_X) { marble.x = BOUND_X; if (marble.vx > 0) { marble.vx = -marble.vx * RESTITUTION; if (marble.vx < -2.3) sndThud(); } }
  if (marble.z < -BOUND_Z) { marble.z = -BOUND_Z; if (marble.vz < 0) { marble.vz = -marble.vz * RESTITUTION; if (marble.vz < -2.3) sndThud(); } }
  else if (marble.z > BOUND_Z) { marble.z = BOUND_Z; if (marble.vz > 0) { marble.vz = -marble.vz * RESTITUTION; if (marble.vz < -2.3) sndThud(); } }
}

function physicsStep(dt) {
  const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
  const h = dt / steps;
  const sinZ = Math.sin(tilt.y), sinX = Math.sin(tilt.x);
  for (let i = 0; i < steps; i++) {
    // gravity projected on the tilted plane (board-local)
    marble.vx += -G * sinZ * h;
    marble.vz +=  G * sinX * h;
    // rolling resistance: constant + speed-proportional
    const sp = Math.hypot(marble.vx, marble.vz);
    if (sp > 0) {
      const dec = Math.min(sp, (1.35 + 0.55 * sp) * h);
      marble.vx -= (marble.vx / sp) * dec;
      marble.vz -= (marble.vz / sp) * dec;
    }
    const sp2 = Math.hypot(marble.vx, marble.vz);
    if (sp2 > 16) { marble.vx = (marble.vx / sp2) * 16; marble.vz = (marble.vz / sp2) * 16; }
    marble.x += marble.vx * h;
    marble.z += marble.vz * h;
    collideWalls();
    // centre over a hole → it goes in
    for (const hole of holes) {
      const dx = marble.x - hole.x, dz = marble.z - hole.z;
      if (dx * dx + dz * dz < CATCH_R * CATCH_R) { startFall(hole.x, hole.z); return; }
    }
    const gdx = marble.x - GOAL.x, gdz = marble.z - GOAL.z;
    if (gdx * gdx + gdz * gdz < CATCH_R * CATCH_R) { winGame(); return; }
  }
}

/* ============================================================
   8.  BENCH API — exposed & updated every frame
   ============================================================ */
window.__bench = {
  state: 'playing',
  tiltX: 0,
  tiltZ: 0,
  marble: { x: START.x, z: START.z },
  falls: 0
};

/* ============================================================
   9.  MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
updateHUD();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  const t = simTime;

  /* ---- tilt targets from held keys ---- */
  const kUp = keys.has('ArrowUp'), kDown = keys.has('ArrowDown'),
        kLeft = keys.has('ArrowLeft'), kRight = keys.has('ArrowRight');
  const keyActive = kUp || kDown || kLeft || kRight;
  if (keyActive) {
    let rx = 0, rz = 0;
    if (kUp) rx -= MAX_TILT;
    if (kDown) rx += MAX_TILT;
    if (kLeft) rz += MAX_TILT;
    if (kRight) rz -= MAX_TILT;
    tiltTarget.set(rx, rz);
  } else if (!dragging) {
    tiltTarget.multiplyScalar(Math.exp(-6 * dt));   // ease back to level
  }

  /* ---- smooth the board tilt ---- */
  tilt.lerp(tiltTarget, 1 - Math.exp(-5.5 * dt));
  boardGroup.rotation.x = tilt.x;
  boardGroup.rotation.z = tilt.y;

  /* ---- game logic ---- */
  if (state === 'playing') {
    elapsed += dt;
    physicsStep(dt);
    marbleMesh.position.set(marble.x, MARBLE_R, marble.z);
    // rolling rotation that exactly matches translation
    const sp = Math.hypot(marble.vx, marble.vz);
    if (sp > 0.02) {
      _axis.set(marble.vz, 0, -marble.vx).normalize();
      _q.setFromAxisAngle(_axis, (sp * dt) / MARBLE_R);
      marbleMesh.quaternion.premultiply(_q);
    }
  } else if (state === 'fell') {
    elapsed += dt;
    fallTimer += dt;
    marbleMesh.position.x += (fallTarget.x - marbleMesh.position.x) * Math.min(1, 12 * dt);
    marbleMesh.position.z += (fallTarget.z - marbleMesh.position.z) * Math.min(1, 12 * dt);
    fallVy += 22 * dt;
    marbleMesh.position.y -= fallVy * dt;
    marbleMesh.rotation.y += dt * 9;
    if (marbleMesh.position.y < -3.6) {   // vanished into the dark → back to start
      resetMarble();
      state = 'playing';
    }
  } else if (state === 'won') {
    winTimer += dt;
    marbleMesh.position.x += (fallTarget.x - marbleMesh.position.x) * Math.min(1, 12 * dt);
    marbleMesh.position.z += (fallTarget.z - marbleMesh.position.z) * Math.min(1, 12 * dt);
    fallVy += 18 * dt;
    marbleMesh.position.y -= fallVy * dt;
    if (winTimer > 0.75 && !overlayShown) {
      overlayShown = true;
      winOverlay.classList.add('visible');
      controls.enabled = true;             // freedom to orbit the table in victory
    }
  }

  updateWinParticles(dt);
  updateHUD();

  /* ---- ambient life ---- */
  lampGroup.rotation.z = Math.sin(t * 0.55) * 0.013;
  lampGroup.rotation.x = Math.cos(t * 0.42) * 0.011;
  glow.material.opacity = 0.66 + Math.sin(t * 1.7) * 0.08;
  goalLight.intensity = 1.05 + Math.sin(t * 2.6) * 0.32;
  goalGlowMat.emissiveIntensity = 1.65 + Math.sin(t * 2.6) * 0.55;
  flagCloth.rotation.y = Math.sin(t * 2.4) * 0.24 + Math.sin(t * 4.9) * 0.07;
  for (let i = 0; i < DUST; i++) {
    dustPos[i * 3]     = dustBase[i * 3] + Math.cos(t * 0.32 + dustPhase[i] * 1.7) * 0.45;
    dustPos[i * 3 + 1] = dustBase[i * 3 + 1] + Math.sin(t * 0.45 + dustPhase[i]) * 0.62;
    dustPos[i * 3 + 2] = dustBase[i * 3 + 2] + Math.sin(t * 0.28 + dustPhase[i] * 2.3) * 0.4;
  }
  dustGeo.attributes.position.needsUpdate = true;
  /* the wall clock keeps honest time */
  const now = new Date();
  const sec = now.getSeconds() + now.getMilliseconds() / 1000;
  const min = now.getMinutes() + sec / 60;
  const hr = (now.getHours() % 12) + min / 60;
  secHand.rotation.z = -(sec / 60) * Math.PI * 2;
  minHand.rotation.z = -(min / 60) * Math.PI * 2;
  hourHand.rotation.z = -(hr / 12) * Math.PI * 2;

  /* ---- bench API, refreshed every frame ---- */
  window.__bench.state = state;
  window.__bench.tiltX = boardGroup.rotation.x;
  window.__bench.tiltZ = boardGroup.rotation.z;
  window.__bench.marble.x = marbleMesh.position.x;
  window.__bench.marble.z = marbleMesh.position.z;
  window.__bench.falls = falls;

  controls.update();
  composer.render();
}
animate();

/* ============================================================
   10. RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
